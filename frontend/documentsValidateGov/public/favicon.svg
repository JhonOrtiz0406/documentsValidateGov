<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Document shape -->
  <rect x="14" y="10" width="28" height="36" rx="3" fill="url(#doc)" opacity="0.9"/>
  <!-- Document fold corner -->
  <polygon points="36,10 42,10 42,16 36,16" fill="#1e293b" opacity="0.5"/>
  <polygon points="36,10 42,16 36,16" fill="white" opacity="0.15"/>
  <!-- Document lines -->
  <rect x="18" y="20" width="16" height="2" rx="1" fill="white" opacity="0.5"/>
  <rect x="18" y="25" width="20" height="2" rx="1" fill="white" opacity="0.5"/>
  <rect x="18" y="30" width="12" height="2" rx="1" fill="white" opacity="0.5"/>
  <!-- Green checkmark circle -->
  <circle cx="43" cy="43" r="12" fill="#0f172a"/>
  <circle cx="43" cy="43" r="10" fill="#22c55e"/>
  <!-- Checkmark -->
  <polyline points="37,43 41,47 49,38" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
